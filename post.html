<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b09">

<title>Publication | ITSFOUR_ HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<style>
.article {
    max-width: 850px;
    margin: auto;
}

.back {
    color: var(--green);
    display: inline-block;
    margin-bottom: 35px;
}

.article h1 {
    font-size: clamp(28px,5vw,45px);
    letter-spacing: -2px;
}

.article-meta {
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 30px;
    font-size: 10px;
}

.markdown {
    color: #bdc9c0;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.markdown h2,
.markdown h3 {
    color: var(--text);
    margin-top: 35px;
}

.markdown a {
    color: var(--green);
}

.markdown pre {
    overflow-x: auto;
    background: #050806;
    padding: 18px;
    border: 1px solid var(--border);
}

.markdown code {
    color: var(--green);
}

.markdown blockquote {
    border-left: 3px solid var(--green);
    padding-left: 15px;
    color: var(--muted);
}

.markdown img {
    max-width: 100%;
}

.article-actions {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

.article-actions button {
    font-family: inherit;
    padding: 10px 15px;
    color: var(--green);
    background: var(--panel);
    border: 1px solid var(--border);
    cursor: pointer;
}

</style>
</head>

<body>

<header class="topbar">
    <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
    </div>
    <div class="terminal-title">ITSFOUR_ HUB <span>/ publication</span></div>
    <div class="status"><span class="status-light"></span> ONLINE</div>
</header>

<main class="content article">

<a href="index.html#posts" class="back">← Back to publications</a>

<div id="article">
    <div class="loading">Loading publication...</div>
</div>

<footer>
    <span>© 2026 ITSFOUR_ HUB</span>
    <span>END OF DOCUMENT</span>
</footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="assets/js/post.js"></script>

</body>
</html>
